name: CI

on:
  push:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  precommit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: pre-commit/action@v3.0.1

  tmtsl:
    runs-on: ubuntu-latest
    needs: precommit
    defaults:
      run:
        working-directory: ./tmtsl

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.22.3

    - name: Install dependencies
      run: go mod download

    - name: Setup gocc
      run: sudo apt-get install gocc
      shell: bash

    - name: Gocc build tmtsl
      run: gocc tmtsl.bnf

    - name: Build
      run: go build -v

    - name: Test
      run: go test -v

  testme:
    runs-on: ubuntu-latest
    needs: [precommit, tmtsl]

    steps:
    - uses: actions/checkout@v4

    - name: Install Clang 18
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18
        export PATH="/usr/lib/llvm-18/bin:$PATH"
        clang --version
        clang++ --version
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y libstdc++-13-dev

    - name: Configure CMake
      run: cmake -B ${{ github.workspace }}/build -DCMAKE_C_COMPILER=/usr/lib/llvm-18/bin/clang -DCMAKE_CXX_COMPILER=/usr/lib/llvm-18/bin/clang++ -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest -C ${{ env.BUILD_TYPE }}

